[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vanguard-redteam"
version = "0.1.0"
description = "Vanguard red-team harness: run a pluggable attacker against an isolated replica and prove findings."
requires-python = ">=3.10"
license = { text = "Apache-2.0" }

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.4"]

[tool.setuptools.packages.find]
include = ["redteam*"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
